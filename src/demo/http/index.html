<!DOCTYPE html>
<html>
	<head>
		<title>MKV HTTP Player Demo</title>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: black;
				font-family: sans-serif;
			}
			video {
				width: 100%;
				height: 100%;
				object-fit: contain;
			}
			#overlay {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
			}
			#overlay > * {
				pointer-events: initial;
			}
			#controls {
				position: absolute;
				top: 0;
				left: 0;
				display: flex;
				gap: 8px;
				padding: 8px;
			}
			#url {
				width: min(60vw, 640px);
			}
			.github-link {
				position: absolute;
				top: 0;
				right: 0;
				padding: 8px;
				color: white;
				text-decoration: none;
			}
			.github-logo {
				width: 32px;
				height: 32px;
				filter: invert(1);
			}
			.attribution {
				position: absolute;
				bottom: 0;
				right: 0;
				padding: 8px;
				color: white;
				text-align: right;
				text-decoration: none;
			}
			.attribution a {
				color: white;
			}
		</style>
	</head>
	<body>
		<video class="mkv-player" controls playsinline>
			<source
				type="video/x-matroska"
				src="https://gyf304.github.io/jsmkv/spring-blender-open-movie.mkv"
			/>
		</video>
		<div id="overlay">
			<div id="controls">
				<input id="url" type="url" placeholder="MKV URL" />
				<button id="load">Load</button>
			</div>
			<div class="github-link">
				<a href="https://github.com/gyf304/jsmkv" target="_blank">
					<img class="github-logo" src="https://unpkg.com/simple-icons@v12/icons/github.svg" alt="GitHub">
				</a>
			</div>
			<a class="attribution" href="https://cloud.blender.org/spring" target="_blank">
				&copy; Blender Foundation | cloud.blender.org/spring
				<br>
				Licensed under CC-BY 4.0
			</a>
		</div>
		<script type="module" src="index.ts"></script>
	</body>
</html>
